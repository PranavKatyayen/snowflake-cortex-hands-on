<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset="0.55" stop-color="#071a33"/>
      <stop offset="1" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#29b5e8" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1f6feb" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe3ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a98bff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29b5e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#29b5e8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#29b5e8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <!-- perspective floor -->
  <g stroke="#29b5e8" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M540 1000L-400 1350M540 1000L-100 1350M540 1000L200 1350M540 1000L440 1350M540 1000L640 1350M540 1000L880 1350M540 1000L1180 1350M540 1000L1480 1350"/>
    <path d="M0 1040H1080M0 1095H1080M0 1170H1080M0 1265H1080"/>
  </g>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <!-- core: concentric rings + crystal -->
  <g transform="translate(540 470)">
    <circle r="210" fill="none" stroke="#29b5e8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle r="165" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="60 18"/>
    <circle r="120" fill="none" stroke="#29b5e8" stroke-opacity="0.6" stroke-width="2"/>
    <circle r="120" fill="none" stroke="#29b5e8" stroke-width="10" stroke-opacity="0.25" filter="url(#blur)"/>
    <g stroke="#7fe3ff" stroke-width="7" stroke-linecap="round" fill="none">
      <g id="arm">
        <path d="M0 -18V-88"/>
        <path d="M0 -58L-20 -78M0 -58L20 -78"/>
      </g>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
    </g>
    <circle r="12" fill="#ffffff"/>
    <!-- orbit nodes -->
    <g font-family="Consolas, 'Cascadia Code', monospace" font-size="17" fill="#cfefff">
      <circle cx="-165" cy="0" r="7" fill="#29b5e8"/>
      <text x="-300" y="6">AGENTS</text>
      <circle cx="165" cy="0" r="7" fill="#8b5cf6"/>
      <text x="190" y="6">MCP</text>
      <circle cx="0" cy="-210" r="6" fill="#7fe3ff"/>
      <text x="16" y="-214">CORTEX</text>
      <circle cx="120" cy="148" r="6" fill="#7fe3ff"/>
      <text x="136" y="168">AI SQL</text>
      <circle cx="-120" cy="148" r="6" fill="#a98bff"/>
      <text x="-250" y="168">COCO</text>
    </g>
  </g>

  <!-- top label -->
  <g font-family="Consolas, 'Cascadia Code', monospace">
    <rect x="64" y="64" width="300" height="40" rx="20" fill="#29b5e8" fill-opacity="0.12" stroke="#29b5e8" stroke-opacity="0.5"/>
    <circle cx="88" cy="84" r="6" fill="#3ddc97"/>
    <text x="104" y="90" font-size="18" fill="#bfefff" letter-spacing="2">NEW SERIES · LIVE</text>
    <text x="1016" y="90" font-size="18" fill="#6f8fb3" text-anchor="end" letter-spacing="2">2026</text>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="540" y="790" font-size="40" font-weight="600" fill="#7fb8d9" letter-spacing="12">SNOWFLAKE AI</text>
    <text x="540" y="890" font-size="112" font-weight="800" fill="url(#title)" letter-spacing="2">HANDS-ON</text>
    <rect x="240" y="920" width="600" height="3" fill="url(#line)"/>
    <text x="540" y="975" font-size="32" fill="#e6f4ff" font-weight="500">No theory. Real builds. Tested end to end.</text>
  </g>

  <!-- feature chips -->
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="20" fill="#dff6ff" text-anchor="middle">
    <rect x="96" y="1035" width="270" height="56" rx="12" fill="#0b2340" fill-opacity="0.85" stroke="#29b5e8" stroke-opacity="0.6"/>
    <text x="231" y="1070">copy-paste labs</text>
    <rect x="405" y="1035" width="270" height="56" rx="12" fill="#0b2340" fill-opacity="0.85" stroke="#29b5e8" stroke-opacity="0.6"/>
    <text x="540" y="1070">real credit costs</text>
    <rect x="714" y="1035" width="270" height="56" rx="12" fill="#1a1440" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="849" y="1070">bleeding-edge tests</text>
  </g>

  <!-- episodes -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="96" y="1130" width="888" height="128" rx="16" fill="#061224" fill-opacity="0.9" stroke="#29b5e8" stroke-opacity="0.25"/>
    <text x="128" y="1180" font-family="Consolas, monospace" font-size="20" fill="#29b5e8">EP 01</text>
    <text x="220" y="1180" font-size="24" fill="#ffffff" font-weight="600">Claude &amp; Cursor talk to your Snowflake data via MCP</text>
    <text x="128" y="1230" font-family="Consolas, monospace" font-size="20" fill="#a98bff">EP 02</text>
    <text x="220" y="1230" font-size="24" fill="#c9d6e8">An AI agent that builds apps inside Snowflake</text>
    <text x="952" y="1230" font-family="Consolas, monospace" font-size="16" fill="#a98bff" text-anchor="end">NEXT ▸</text>
  </g>

  <!-- footer -->
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="18" fill="#6f8fb3">
    <text x="96" y="1310">by Pranav Katyayen</text>
    <text x="984" y="1310" text-anchor="end">github.com/PranavKatyayen/snowflake-cortex-hands-on</text>
  </g>
</svg>
