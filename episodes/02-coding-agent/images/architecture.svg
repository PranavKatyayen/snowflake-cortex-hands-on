<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0E1A30"/>
    </linearGradient>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29B5E8"/>
      <stop offset="1" stop-color="#6E8BFF"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3D6B"/>
      <stop offset="1" stop-color="#14294A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#29B5E8"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E8BFF"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F2B84B"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#36C5A4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.03">
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/>
  </g>

  <!-- Title -->
  <text x="60" y="68" font-size="34" font-weight="700" fill="#FFFFFF">Ask in chat. An agent inside Snowflake builds the app.</text>
  <text x="60" y="102" font-size="19" fill="#9FB0CC">CODING_AGENT MCP tool · managed sandbox · your approval on every change · Streamlit in Snowflake</text>
  <rect x="1330" y="44" width="210" height="40" rx="20" fill="none" stroke="url(#sf)" stroke-width="2"/>
  <text x="1435" y="70" font-size="16" font-weight="600" fill="#29B5E8" text-anchor="middle">EPISODE 2</text>

  <!-- ===================== YOU + CLIENT ===================== -->
  <text x="60" y="168" font-size="14" font-weight="700" fill="#7C8AA5" letter-spacing="2">YOU + AI CLIENT</text>

  <rect x="60" y="184" width="300" height="82" rx="14" fill="#1A2540" stroke="#2E3F63"/>
  <path d="M110 266 L122 282 L134 266 z" fill="#1A2540" stroke="#2E3F63"/>
  <rect x="111" y="264" width="22" height="4" fill="#1A2540"/>
  <text x="80" y="212" font-size="15" fill="#E6ECF7" font-style="italic">“Build and deploy a live dashboard:</text>
  <text x="80" y="233" font-size="15" fill="#E6ECF7" font-style="italic">revenue by store, a 14-day forecast</text>
  <text x="80" y="254" font-size="15" fill="#E6ECF7" font-style="italic">and the latest complaints.”</text>

  <g>
    <rect x="60" y="300" width="300" height="96" rx="14" fill="#131C2E" stroke="#D97757" stroke-width="2"/>
    <circle cx="100" cy="348" r="20" fill="#D97757"/>
    <text x="100" y="355" font-size="20" font-weight="700" fill="#131C2E" text-anchor="middle">C</text>
    <text x="134" y="342" font-size="21" font-weight="700" fill="#FFFFFF">Claude</text>
    <text x="134" y="367" font-size="14" fill="#9FB0CC">or any MCP client</text>
  </g>

  <!-- approvals -->
  <g>
    <rect x="60" y="430" width="300" height="190" rx="14" fill="#1C1A12" stroke="#F2B84B" stroke-width="2"/>
    <text x="80" y="460" font-size="13" font-weight="700" fill="#F2B84B" letter-spacing="2">YOU APPROVE EACH CHANGE</text>
    <g font-size="15" fill="#E6ECF7">
      <text x="80" y="494">① write the app files</text>
      <text x="80" y="530">② test against live data</text>
      <text x="80" y="566">③ deploy the app</text>
    </g>
    <g font-size="12" font-weight="700" fill="#0A1020">
      <rect x="276" y="479" width="64" height="22" rx="11" fill="#36C5A4"/><text x="308" y="495" text-anchor="middle">Allow</text>
      <rect x="276" y="515" width="64" height="22" rx="11" fill="#36C5A4"/><text x="308" y="531" text-anchor="middle">Allow</text>
      <rect x="276" y="551" width="64" height="22" rx="11" fill="#36C5A4"/><text x="308" y="567" text-anchor="middle">Allow</text>
    </g>
    <text x="80" y="600" font-size="12" fill="#C9B98A">each request comes with a risk level</text>
  </g>

  <!-- client -> server -->
  <line x1="360" y1="348" x2="500" y2="348" stroke="#29B5E8" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- approval loop -->
  <path d="M500 470 L366 470" fill="none" stroke="#F2B84B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arra)"/>
  <text x="433" y="461" font-size="12" fill="#F2B84B" text-anchor="middle">risk-rated request</text>
  <path d="M362 540 L498 540" fill="none" stroke="#36C5A4" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="430" y="531" font-size="12" fill="#36C5A4" text-anchor="middle">Allow / Deny</text>

  <rect x="376" y="660" width="120" height="78" rx="10" fill="#101A2C" stroke="#2E3F63"/>
  <text x="436" y="684" font-size="13" font-weight="700" fill="#29B5E8" text-anchor="middle">HTTPS</text>
  <text x="436" y="704" font-size="13" fill="#C8D3E6" text-anchor="middle">MCP · JSON-RPC</text>
  <text x="436" y="724" font-size="13" fill="#C8D3E6" text-anchor="middle">OAuth 2.0 + PKCE</text>
  <line x1="436" y1="660" x2="436" y2="550" stroke="#2E3F63" stroke-dasharray="3 4"/>

  <!-- ===================== SNOWFLAKE ACCOUNT ===================== -->
  <rect x="505" y="150" width="1040" height="660" rx="22" fill="#0D1729" stroke="url(#sf)" stroke-width="2.5"/>
  <g transform="translate(535,186)">
    <g stroke="#29B5E8" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <line x1="-10.4" y1="-6" x2="10.4" y2="6"/>
      <line x1="-10.4" y1="6" x2="10.4" y2="-6"/>
    </g>
  </g>
  <text x="558" y="193" font-size="16" font-weight="700" fill="#29B5E8" letter-spacing="2">SNOWFLAKE ACCOUNT</text>
  <text x="1515" y="193" font-size="14" fill="#7C8AA5" text-anchor="end">SNOWBREW_LAB</text>

  <!-- MCP server -->
  <rect x="535" y="225" width="290" height="230" rx="16" fill="#122039" stroke="#29B5E8" stroke-width="2" filter="url(#glow)"/>
  <text x="557" y="258" font-size="13" font-weight="700" fill="#29B5E8" letter-spacing="2">MCP SERVER</text>
  <text x="557" y="286" font-size="20" font-weight="700" fill="#FFFFFF">SNOWBREW_BUILDER_MCP</text>
  <text x="557" y="308" font-size="13" fill="#9FB0CC">declared in SQL · one HTTPS endpoint</text>
  <rect x="555" y="326" width="250" height="56" rx="10" fill="#1E4A80" stroke="#29B5E8"/>
  <text x="570" y="349" font-size="14" font-weight="700" fill="#FFFFFF">snowbrew_builder</text>
  <text x="570" y="370" font-size="12" fill="#BFD3F0">type: CODING_AGENT</text>
  <text x="557" y="410" font-size="12" fill="#7C8AA5">no stored agent object: the whole</text>
  <text x="557" y="428" font-size="12" fill="#7C8AA5">config lives in the tool spec</text>

  <!-- MCP -> agent -->
  <line x1="805" y1="354" x2="868" y2="354" stroke="#29B5E8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Coding agent -->
  <rect x="870" y="225" width="260" height="230" rx="16" fill="url(#agent)" stroke="#6E8BFF" stroke-width="2"/>
  <text x="892" y="258" font-size="13" font-weight="700" fill="#A9B8FF" letter-spacing="2">CODING AGENT</text>
  <text x="892" y="288" font-size="22" font-weight="700" fill="#FFFFFF">Snowbrew builder</text>
  <g font-size="14" fill="#D5DEF0">
    <text x="892" y="322">① explore (read-only SQL)</text>
    <text x="892" y="346">② write all files</text>
    <text x="892" y="370">③ test on live data</text>
    <text x="892" y="394">④ deploy + send the link</text>
  </g>
  <text x="892" y="426" font-size="12" fill="#8FA0C8">an LLM plans, the sandbox executes</text>

  <!-- agent -> sandbox -->
  <line x1="1000" y1="455" x2="1000" y2="498" stroke="#6E8BFF" stroke-width="2.5" marker-end="url(#arrv)"/>

  <!-- Sandbox -->
  <rect x="535" y="500" width="595" height="190" rx="16" fill="#111C30" stroke="#6E8BFF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="557" y="532" font-size="13" font-weight="700" fill="#A9B8FF" letter-spacing="2">MANAGED SANDBOX · attached to the chat thread</text>
  <g font-size="14" font-weight="600" fill="#E6ECF7">
    <rect x="557" y="550" width="86" height="34" rx="17" fill="#17294A" stroke="#2E3F63"/><text x="600" y="572" text-anchor="middle">bash</text>
    <rect x="653" y="550" width="168" height="34" rx="17" fill="#17294A" stroke="#2E3F63"/><text x="737" y="572" text-anchor="middle">read · write · edit</text>
    <rect x="831" y="550" width="132" height="34" rx="17" fill="#17294A" stroke="#2E3F63"/><text x="897" y="572" text-anchor="middle">Snowflake SQL</text>
    <rect x="973" y="550" width="135" height="34" rx="17" fill="#17294A" stroke="#2E3F63"/><text x="1040" y="572" text-anchor="middle">web search</text>
  </g>
  <text x="557" y="620" font-size="15" fill="#D5DEF0">Python 3.12 · pandas · numpy · Snowpark</text>
  <text x="557" y="648" font-size="15" fill="#D5DEF0">short-lived session token = <tspan font-weight="700" fill="#FFFFFF">your role</tspan>, not a service account</text>
  <text x="557" y="674" font-size="12" fill="#7C8AA5">it can only touch what MCP_LAB_ROLE can touch</text>

  <!-- sandbox -> data / apps -->
  <path d="M1130 560 C 1160 560, 1160 300, 1188 300" fill="none" stroke="#36C5A4" stroke-width="2" marker-end="url(#arrg)"/>
  <text x="1150" y="430" font-size="12" fill="#36C5A4" transform="rotate(-90 1150 430)" text-anchor="middle">read + test</text>
  <path d="M1130 640 C 1165 640, 1165 470, 1188 470" fill="none" stroke="#E86A92" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Data -->
  <g>
    <rect x="1190" y="232" width="325" height="130" rx="14" fill="#131F36" stroke="#2E3F63"/>
    <rect x="1190" y="232" width="6" height="130" rx="3" fill="#36C5A4"/>
    <text x="1212" y="260" font-size="13" font-weight="700" fill="#36C5A4" letter-spacing="2">READS · CORE</text>
    <text x="1212" y="288" font-size="17" font-weight="700" fill="#FFFFFF">Your tables</text>
    <text x="1212" y="314" font-size="13" fill="#9FB0CC">DAILY_SALES · STORES · PRODUCTS</text>
    <text x="1212" y="336" font-size="13" fill="#9FB0CC">CUSTOMER_FEEDBACK</text>
  </g>

  <!-- APPS outputs -->
  <g>
    <rect x="1190" y="390" width="325" height="96" rx="14" fill="#131F36" stroke="#2E3F63"/>
    <rect x="1190" y="390" width="6" height="96" rx="3" fill="#E86A92"/>
    <text x="1212" y="418" font-size="13" font-weight="700" fill="#E86A92" letter-spacing="2">WRITES · APPS</text>
    <text x="1212" y="444" font-size="17" font-weight="700" fill="#FFFFFF">Stage with app files</text>
    <text x="1212" y="468" font-size="13" fill="#9FB0CC">streamlit_app.py · environment.yml</text>
  </g>
  <line x1="1352" y1="486" x2="1352" y2="516" stroke="#E86A92" stroke-width="2" marker-end="url(#arr)"/>
  <g>
    <rect x="1190" y="518" width="325" height="172" rx="14" fill="#10241F" stroke="#36C5A4" stroke-width="2" filter="url(#glow)"/>
    <text x="1212" y="548" font-size="13" font-weight="700" fill="#36C5A4" letter-spacing="2">LIVE STREAMLIT APP</text>
    <text x="1212" y="576" font-size="17" font-weight="700" fill="#FFFFFF">Snowbrew dashboard</text>
    <g>
      <rect x="1212" y="592" width="18" height="44" fill="#29B5E8"/><rect x="1234" y="606" width="18" height="30" fill="#6E8BFF"/>
      <rect x="1262" y="598" width="18" height="38" fill="#29B5E8"/><rect x="1284" y="590" width="18" height="46" fill="#6E8BFF"/>
      <rect x="1312" y="612" width="18" height="24" fill="#29B5E8"/><rect x="1334" y="616" width="18" height="20" fill="#6E8BFF"/>
      <polyline points="1370,628 1392,612 1414,620 1436,600 1458,606 1490,590" fill="none" stroke="#F2B84B" stroke-width="2.5"/>
    </g>
    <text x="1212" y="664" font-size="13" fill="#9FB0CC">warehouse runtime · queries live data</text>
    <text x="1212" y="682" font-size="13" fill="#9FB0CC">link sent back to your chat</text>
  </g>

  <!-- Governance -->
  <text x="535" y="726" font-size="13" font-weight="700" fill="#7C8AA5" letter-spacing="2">GOVERNANCE &amp; COMPUTE</text>
  <g font-size="14" font-weight="600" fill="#E6ECF7">
    <rect x="535" y="740" width="232" height="44" rx="22" fill="#14223B" stroke="#2E3F63"/>
    <text x="651" y="767" text-anchor="middle">🔐 Runs as MCP_LAB_ROLE</text>
    <rect x="781" y="740" width="232" height="44" rx="22" fill="#14223B" stroke="#2E3F63"/>
    <text x="897" y="767" text-anchor="middle">✋ Every write needs Allow</text>
    <rect x="1027" y="740" width="232" height="44" rx="22" fill="#14223B" stroke="#2E3F63"/>
    <text x="1143" y="767" text-anchor="middle">📦 Builds only in APPS</text>
    <rect x="1273" y="740" width="242" height="44" rx="22" fill="#14223B" stroke="#2E3F63"/>
    <text x="1394" y="767" text-anchor="middle">⚡ Warehouse · MCP_LAB_WH</text>
  </g>

  <!-- Footer -->
  <text x="60" y="860" font-size="15" fill="#7C8AA5">Snowflake AI, Hands-On · Episode 2</text>
  <text x="1540" y="860" font-size="15" fill="#7C8AA5" text-anchor="end">No code written by you · data never leaves Snowflake · tested Nov 2026</text>
</svg>
